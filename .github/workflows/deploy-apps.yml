name: Deploy apps

on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      deploy_web:
        description: Deploy the web app to Cloudflare Workers
        type: boolean
        default: true
      build_apk:
        description: Build an Android APK (attached to the run as an artifact)
        type: boolean
        default: true
      play_store:
        description: Build an Android App Bundle and submit it to Google Play
        type: boolean
        default: false
      play_store_track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_store_release_status:
        description: Google Play release status (use draft until the app's first release is published)
        type: choice
        options: [completed, draft, inProgress, halted]
        default: completed
      android_builder:
        description: Where Android builds run
        type: choice
        options: [eas, runner]
        default: eas
      wait_for_eas:
        description: With the eas builder, wait for the APK and attach it to the run (can sit in the EAS queue for a long time)
        type: boolean
        default: false

concurrency:
  group: deploy-apps-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_BUILDER: ${{ inputs.android_builder || vars.ANDROID_BUILDER || 'eas' }}

jobs:
  web:
    if: github.event_name == 'push' || inputs.deploy_web
    runs-on: ubuntu-latest
    environment: web-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '@photos/web...'
      - run: pnpm --filter @photos/web typecheck
      - run: pnpm --filter @photos/web build

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Set the API_URL repository variable to the public API address." >&2
            exit 1
          fi

          pnpm exec wrangler deploy --var "API_URL:$API_URL"

  android-apk:
    if: github.event_name == 'push' || inputs.build_apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAIT_FOR_EAS: ${{ inputs.wait_for_eas || vars.WAIT_FOR_EAS || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-eas
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          builder: ${{ env.ANDROID_BUILDER }}
          eas-project-id: ${{ vars.EAS_PROJECT_ID }}
          eas-owner: ${{ vars.EAS_OWNER }}
          api-url: ${{ vars.API_URL }}
          web-url: ${{ vars.WEB_URL }}
          android-architectures: ${{ vars.APK_ARCHITECTURES || 'arm64-v8a,armeabi-v7a' }}

      - name: Build APK
        id: build
        working-directory: apps/mobile
        run: |
          if [ "$ANDROID_BUILDER" = "runner" ]; then
            eas build --platform android --profile preview --local --non-interactive --output "$RUNNER_TEMP/app.apk"
            ccache --show-stats || true
            echo "apk=true" >> "$GITHUB_OUTPUT"
          elif [ "$WAIT_FOR_EAS" = "true" ]; then
            eas build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
            curl -fsSL -o "$RUNNER_TEMP/app.apk" "$(jq -r '.[0].artifacts.buildUrl' "$RUNNER_TEMP/build.json")"
            echo "apk=true" >> "$GITHUB_OUTPUT"
          else
            eas build --platform android --profile preview --non-interactive --no-wait --json > "$RUNNER_TEMP/build.json"
            build_id="$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")"
            account="$(jq -r '.[0].project.ownerAccount.name' "$RUNNER_TEMP/build.json")"
            slug="$(jq -r '.[0].project.slug' "$RUNNER_TEMP/build.json")"
            url="https://expo.dev/accounts/$account/projects/$slug/builds/$build_id"

            echo "APK build queued on EAS: $url"
            printf '### APK build queued on EAS\n\n[%s](%s) shows its progress, and an install QR code once it is done.\n' "$url" "$url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.apk == 'true'
        with:
          name: toneflix-photos-${{ github.sha }}-apk
          path: ${{ runner.temp }}/app.apk
          if-no-files-found: error

  play-store:
    if: (github.event_name == 'push' && vars.PLAY_STORE_ON_DEPLOY == 'true') || inputs.play_store
    runs-on: ubuntu-latest
    environment: play-store
    timeout-minutes: 120
    env:
      TRACK: ${{ inputs.play_store_track || vars.PLAY_STORE_TRACK || 'internal' }}
      RELEASE_STATUS: ${{ inputs.play_store_release_status || vars.PLAY_STORE_RELEASE_STATUS || 'completed' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-eas
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          builder: ${{ env.ANDROID_BUILDER }}
          eas-project-id: ${{ vars.EAS_PROJECT_ID }}
          eas-owner: ${{ vars.EAS_OWNER }}
          api-url: ${{ vars.API_URL }}
          web-url: ${{ vars.WEB_URL }}

      - name: Configure the Google Play submission
        working-directory: apps/mobile
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          submit='.submit.production.android.track = $track | .submit.production.android.releaseStatus = $status'

          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
            submit="$submit | .submit.production.android.serviceAccountKeyPath = \$key"
          fi

          jq --arg track "$TRACK" --arg status "$RELEASE_STATUS" --arg key "$RUNNER_TEMP/play-service-account.json" \
            "$submit" eas.json > eas.tmp.json
          mv eas.tmp.json eas.json

      - name: Build the App Bundle
        id: build
        working-directory: apps/mobile
        run: |
          if [ "$ANDROID_BUILDER" = "runner" ]; then
            eas build --platform android --profile production --local --non-interactive --output "$RUNNER_TEMP/app.aab"
          else
            eas build --platform android --profile production --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
            echo "id=$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit to Google Play
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          if [ -n "$BUILD_ID" ]; then
            eas submit --platform android --profile production --id "$BUILD_ID" --non-interactive --wait
          else
            eas submit --platform android --profile production --path "$RUNNER_TEMP/app.aab" --non-interactive --wait
          fi

      - uses: actions/upload-artifact@v7
        if: env.ANDROID_BUILDER == 'runner'
        with:
          name: toneflix-photos-${{ github.sha }}-aab
          path: ${{ runner.temp }}/app.aab
